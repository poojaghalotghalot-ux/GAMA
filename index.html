<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go Traders - Portal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 relative overflow-x-hidden">

    <!-- Background Decor -->
    <div class="absolute -top-20 -left-20 w-72 h-72 bg-sky-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-20 -right-20 w-72 h-72 bg-emerald-600/20 rounded-full blur-3xl pointer-events-none"></div>

    <!-- MAIN CONTAINER -->
    <main class="w-full max-w-md z-10">
        
        <!-- LOGIN CARD -->
        <div id="auth-container" class="glass-card rounded-2xl p-8 shadow-2xl transition-all duration-300">
            
            <!-- Branding Header -->
            <div class="text-center mb-6">
                <div class="inline-flex items-center justify-center w-12 h-12 bg-sky-500/10 border border-sky-500/20 rounded-xl mb-3 text-sky-400 font-bold text-xl">
                    GT
                </div>
                <h1 class="text-2xl font-extrabold tracking-tight text-white">Go Traders</h1>
                <p class="text-slate-400 text-xs mt-1">Apne account me login karein</p>
            </div>

            <!-- Status / Alert Box -->
            <div id="alert-box" class="hidden mb-4 p-3 rounded-lg text-xs text-center border"></div>

            <!-- STEP 1: Phone Form -->
            <form id="phone-form" class="space-y-4">
                <div>
                    <label for="phone-input" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Mobile Number</label>
                    <div class="flex">
                        <span class="inline-flex items-center px-3.5 rounded-l-xl border border-r-0 border-slate-700 bg-slate-800 text-slate-300 text-sm font-semibold">+91</span>
                        <input type="tel" id="phone-input" maxlength="10" placeholder="8510084212" required 
                               class="w-full bg-slate-900/80 border border-slate-700 rounded-r-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-sky-500 transition">
                    </div>
                </div>

                <button type="submit" id="send-otp-btn" 
                        class="w-full bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold py-3 rounded-xl transition-all duration-200 shadow-lg shadow-sky-500/20 disabled:opacity-50">
                    OTP Bhejein
                </button>
            </form>

            <!-- STEP 2: OTP Form (Initially Hidden) -->
            <form id="otp-form" class="space-y-4 hidden">
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label for="otp-input" class="text-xs font-semibold text-slate-300 uppercase tracking-wider">6-Digit OTP</label>
                        <span id="target-phone" class="text-xs text-sky-400 font-mono"></span>
                    </div>
                    <input type="text" id="otp-input" maxlength="6" placeholder="123456" required
                           class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-3 text-center text-2xl font-mono tracking-widest text-white focus:outline-none focus:border-sky-500 transition">
                </div>

                <button type="submit" id="verify-otp-btn" 
                        class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3 rounded-xl transition-all duration-200 shadow-lg shadow-emerald-500/20 disabled:opacity-50">
                    Verify & Continue
                </button>

                <button type="button" id="change-num-btn" class="w-full text-xs text-slate-400 hover:text-slate-200 transition text-center">
                    Number badlein
                </button>
            </form>
        </div>

        <!-- GO TRADERS DASHBOARD (Showed after success) -->
        <div id="dashboard-container" class="hidden glass-card rounded-2xl p-6 shadow-2xl text-center space-y-4">
            <div class="w-16 h-16 bg-emerald-500/20 border border-emerald-500/30 text-emerald-400 rounded-full flex items-center justify-center mx-auto text-2xl">
                ✓
            </div>
            <h2 class="text-xl font-bold text-white">Go Traders Dashboard</h2>
            <p class="text-slate-400 text-sm">Aapka login safaltapoorvak ho gaya h.</p>
            
            <div class="bg-slate-900/50 p-4 rounded-xl text-left border border-slate-800 space-y-2">
                <div class="text-xs text-slate-500">USER PROFILE</div>
                <div class="text-sm font-semibold text-slate-200" id="user-display-phone">+91 8510084212</div>
                <div class="text-xs text-emerald-400">Account Active</div>
            </div>

            <button id="logout-btn" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-2.5 rounded-xl border border-slate-700 text-sm transition">
                Logout Karein
            </button>
        </div>

    </main>

    <script>
        const phoneForm = document.getElementById('phone-form');
        const otpForm = document.getElementById('otp-form');
        const authContainer = document.getElementById('auth-container');
        const dashboardContainer = document.getElementById('dashboard-container');
        
        const phoneInput = document.getElementById('phone-input');
        const otpInput = document.getElementById('otp-input');
        const sendBtn = document.getElementById('send-otp-btn');
        const verifyBtn = document.getElementById('verify-otp-btn');
        const alertBox = document.getElementById('alert-box');
        const targetPhoneLabel = document.getElementById('target-phone');
        const userDisplayPhone = document.getElementById('user-display-phone');
        const changeNumBtn = document.getElementById('change-num-btn');
        const logoutBtn = document.getElementById('logout-btn');

        let activePhone = '';

        function showAlert(msg, type = 'error') {
            alertBox.innerText = msg;
            alertBox.classList.remove('hidden', 'bg-red-500/20', 'text-red-300', 'border-red-500/30', 'bg-emerald-500/20', 'text-emerald-300', 'border-emerald-500/30');
            
            if (type === 'error') {
                alertBox.classList.add('bg-red-500/20', 'text-red-300', 'border-red-500/30');
            } else {
                alertBox.classList.add('bg-emerald-500/20', 'text-emerald-300', 'border-emerald-500/30');
            }
        }

        // STEP 1: Submit Phone Number
        phoneForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const val = phoneInput.value.trim();

            if (val.length !== 10) {
                showAlert('Kripya valid 10-digit mobile number daalein.');
                return;
            }

            activePhone = `+91 ${val}`;
            sendBtn.disabled = true;
            sendBtn.innerText = 'Bhej rahe hain...';

            // Simulate API request without CORS or Fetch Errors
            setTimeout(() => {
                sendBtn.disabled = false;
                sendBtn.innerText = 'OTP Bhejein';
                
                showAlert('OTP bhej diya gaya h! (Testing OTP: 123456)', 'success');
                phoneForm.classList.add('hidden');
                otpForm.classList.remove('hidden');
                targetPhoneLabel.innerText = activePhone;
            }, 1000);
        });

        // STEP 2: Verify OTP Code
        otpForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const code = otpInput.value.trim();

            if (code.length !== 6) {
                showAlert('6-digit ka OTP code darj karein.');
                return;
            }

            verifyBtn.disabled = true;
            verifyBtn.innerText = 'Checking...';

            setTimeout(() => {
                verifyBtn.disabled = false;
                verifyBtn.innerText = 'Verify & Continue';

                // Demo verification (123456 or any 6 digit code for test)
                showAlert('Login successful!', 'success');
                
                setTimeout(() => {
                    authContainer.classList.add('hidden');
                    dashboardContainer.classList.remove('hidden');
                    userDisplayPhone.innerText = activePhone;
                }, 800);

            }, 1000);
        });

        // Reset Form
        changeNumBtn.addEventListener('click', () => {
            otpForm.classList.add('hidden');
            phoneForm.classList.remove('hidden');
            alertBox.classList.add('hidden');
            otpInput.value = '';
        });

        // Logout Event
        logoutBtn.addEventListener('click', () => {
            dashboardContainer.classList.add('hidden');
            authContainer.classList.remove('hidden');
            phoneForm.classList.remove('hidden');
            otpForm.classList.add('hidden');
            alertBox.classList.add('hidden');
            phoneInput.value = '';
            otpInput.value = '';
        });
    </script>
</body>
</html>
