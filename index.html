<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApexTrade Pro - Advanced Paper Trading Platform</title>
    <!-- Google Fonts & Chart.js -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-primary: #0b0e14;
            --bg-secondary: #131722;
            --bg-card: #1e222d;
            --accent-green: #089981;
            --accent-red: #f23645;
            --accent-blue: #2962ff;
            --text-main: #d1d4dc;
            --text-muted: #787b86;
            --border-color: #2a2e39;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo span {
            color: var(--accent-blue);
        }

        .user-stats {
            display: flex;
            gap: 25px;
            font-size: 14px;
        }

        .stat-box {
            background: var(--bg-card);
            padding: 8px 15px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .stat-box span {
            display: block;
            color: var(--text-muted);
            font-size: 11px;
            text-transform: uppercase;
        }

        .stat-box strong {
            font-size: 16px;
            color: #fff;
        }

        .main-container {
            display: grid;
            grid-template-columns: 280px 1fr 320px;
            gap: 1px;
            background-color: var(--border-color);
            flex: 1;
        }

        .panel {
            background-color: var(--bg-secondary);
            padding: 20px;
            overflow-y: auto;
        }

        h3 {
            font-size: 14px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }

        /* Watchlist */
        .watchlist-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: var(--bg-card);
            border-radius: 6px;
            margin-bottom: 8px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: 0.2s;
        }

        .watchlist-item:hover, .watchlist-item.active {
            border-color: var(--accent-blue);
        }

        .ticker-symbol {
            font-weight: 600;
            color: #fff;
        }

        .ticker-name {
            font-size: 12px;
            color: var(--text-muted);
        }

        .ticker-price {
            text-align: right;
            font-weight: 500;
        }

        .price-change {
            font-size: 12px;
        }

        .positive { color: var(--accent-green); }
        .negative { color: var(--accent-red); }

        /* Chart Center */
        .center-panel {
            background-color: var(--bg-primary);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .chart-container {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            height: 400px;
            position: relative;
        }

        /* Order Form Panel */
        .order-panel {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .form-control {
            width: 100%;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 10px;
            border-radius: 4px;
            font-size: 14px;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: opacity 0.2s;
        }

        .btn:hover { opacity: 0.85; }
        .btn-buy { background-color: var(--accent-green); color: #fff; }
        .btn-sell { background-color: var(--accent-red); color: #fff; }

        /* Portfolio & Transactions Bottom Area */
        .bottom-section {
            grid-column: 1 / -1;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            padding: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            font-size: 13px;
        }

        th {
            color: var(--text-muted);
            font-weight: 500;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }
        .badge-buy { background: rgba(8, 153, 129, 0.2); color: var(--accent-green); }
        .badge-sell { background: rgba(242, 54, 69, 0.2); color: var(--accent-red); }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            📈 <span>ApexTrade</span> Pro
        </div>
        <div class="user-stats">
            <div class="stat-box">
                <span>Cash Balance</span>
                <strong id="header-cash">$50,000.00</strong>
            </div>
            <div class="stat-box">
                <span>Portfolio Value</span>
                <strong id="header-portfolio">$0.00</strong>
            </div>
            <div class="stat-box">
                <span>Net Worth</span>
                <strong id="header-networth">$50,000.00</strong>
            </div>
        </div>
    </header>

    <div class="main-container">
        <!-- Left: Watchlist -->
        <div class="panel">
            <h3>Market Watchlist</h3>
            <div id="watchlist-container">
                <!-- Injected via JS -->
            </div>
        </div>

        <!-- Center: Interactive Chart & Trade Execution -->
        <div class="center-panel">
            <div class="chart-container">
                <canvas id="stockChart"></canvas>
            </div>

            <!-- Positions & Holdings Quick View -->
            <div class="bottom-section" style="background: transparent; border: none; padding: 0;">
                <h3>Active Portfolio Holdings</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Asset</th>
                            <th>Shares Held</th>
                            <th>Avg Buy Price</th>
                            <th>Current Price</th>
                            <th>Total Value</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="portfolio-table-body">
                        <tr><td colspan="6" style="text-align: center; color: var(--text-muted);">No open positions.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Right: Trade Panel -->
        <div class="panel">
            <div class="order-panel">
                <h3>Order Ticket</h3>
                <div class="form-group" style="margin-top: 10px;">
                    <label>Selected Asset</label>
                    <input type="text" id="selected-asset" class="form-control" readonly value="AAPL">
                </div>
                <div class="form-group">
                    <label>Current Market Price</label>
                    <input type="text" id="selected-price" class="form-control" readonly value="$180.50">
                </div>
                <div class="form-group">
                    <label>Quantity (Shares)</label>
                    <input type="number" id="order-quantity" class="form-control" value="1" min="1">
                </div>
                <div class="btn-group">
                    <button class="btn btn-buy" onclick="executeOrder('BUY')">BUY</button>
                    <button class="btn btn-sell" onclick="executeOrder('SELL')">SELL</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // State Management
        let cash = 50000.00;
        let portfolio = {}; // { AAPL: { shares: 5, avgPrice: 180 } }
        let selectedTicker = 'AAPL';

        const stocks = {
            AAPL: { name: 'Apple Inc.', price: 180.50, history: [178, 179, 181, 180, 180.50] },
            TSLA: { name: 'Tesla Inc.', price: 240.20, history: [235, 238, 237, 241, 240.20] },
            GOOGL: { name: 'Alphabet Inc.', price: 140.10, history: [138, 139, 140, 140.5, 140.10] },
            AMZN: { name: 'Amazon.com', price: 135.80, history: [134, 135, 136, 135.5, 135.80] },
            NVDA: { name: 'NVIDIA Corp.', price: 880.00, history: [870, 875, 882, 878, 880.00] }
        };

        // Chart Initialization
        const ctx = document.getElementById('stockChart').getContext('2d');
        let stockChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['10:00', '11:00', '12:00', '13:00', 'Live'],
                datasets: [{
                    label: 'Price (USD)',
                    data: stocks[selectedTicker].history,
                    borderColor: '#2962ff',
                    borderWidth: 2,
                    pointRadius: 2,
                    tension: 0.2,
                    fill: true,
                    backgroundColor: 'rgba(41, 98, 255, 0.05)'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { grid: { color: '#2a2e39' }, ticks: { color: '#787b86' } },
                    y: { grid: { color: '#2a2e39' }, ticks: { color: '#787b86' } }
                }
            }
        });

        function renderWatchlist() {
            const container = document.getElementById('watchlist-container');
            container.innerHTML = '';
            for (const [ticker, data] of Object.entries(stocks)) {
                let isSelected = ticker === selectedTicker ? 'active' : '';
                container.innerHTML += `
                    <div class="watchlist-item ${isSelected}" onclick="selectStock('${ticker}')">
                        <div>
                            <div class="ticker-symbol">${ticker}</div>
                            <div class="ticker-name">${data.name}</div>
                        </div>
                        <div class="ticker-price">
                            <div>$${data.price.toFixed(2)}</div>
                        </div>
                    </div>
                `;
            }
        }

        function selectStock(ticker) {
            selectedTicker = ticker;
            document.getElementById('selected-asset').value = ticker;
            document.getElementById('selected-price').value = `$${stocks[ticker].price.toFixed(2)}`;
            stockChart.data.datasets[0].data = stocks[ticker].history;
            stockChart.update();
            renderWatchlist();
        }

        function executeOrder(type) {
            const qty = parseInt(document.getElementById('order-quantity').value);
            if (isNaN(qty) || qty <= 0) {
                alert("Please enter a valid share quantity.");
                return;
            }

            const currentPrice = stocks[selectedTicker].price;
            const totalCost = qty * currentPrice;

            if (type === 'BUY') {
                if (cash < totalCost) {
                    alert("Insufficient cash balance for this trade!");
                    return;
                }
                cash -= totalCost;
                if (!portfolio[selectedTicker]) {
                    portfolio[selectedTicker] = { shares: 0, avgPrice: 0 };
                }
                let currentHolding = portfolio[selectedTicker];
                let newTotalShares = currentHolding.shares + qty;
                currentHolding.avgPrice = ((currentHolding.shares * currentHolding.avgPrice) + totalCost) / newTotalShares;
                currentHolding.shares = newTotalShares;
            } else if (type === 'SELL') {
                if (!portfolio[selectedTicker] || portfolio[selectedTicker].shares < qty) {
                    alert("You do not own enough shares to sell this quantity!");
                    return;
                }
                cash += totalCost;
                portfolio[selectedTicker].shares -= qty;
                if (portfolio[selectedTicker].shares === 0) {
                    delete portfolio[selectedTicker];
                }
            }
            updateUI();
        }

        function sellPosition(ticker) {
            let holding = portfolio[ticker];
            if (holding) {
                cash += holding.shares * stocks[ticker].price;
                delete portfolio[ticker];
                updateUI();
            }
        }

        function updateUI() {
            document.getElementById('header-cash').innerText = `$${cash.toLocaleString('en-US', {minimumFractionDigits: 2})}`;
            
            // Calculate Portfolio Value
            let portfolioValue = 0;
            const tbody = document.getElementById('portfolio-table-body');
            tbody.innerHTML = '';

            const keys = Object.keys(portfolio);
            if (keys.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--text-muted);">No open positions.</td></tr>`;
            } else {
                keys.forEach(ticker => {
                    let holding = portfolio[ticker];
                    let currentVal = holding.shares * stocks[ticker].price;
                    portfolioValue += currentVal;

                    tbody.innerHTML += `
                        <tr>
                            <td><strong>${ticker}</strong></td>
                            <td>${holding.shares}</td>
                            <td>$${holding.avgPrice.toFixed(2)}</td>
                            <td>$${stocks[ticker].price.toFixed(2)}</td>
                            <td>$${currentVal.toFixed(2)}</td>
                            <td><button class="btn" style="background:var(--accent-red); color:#fff; padding:4px 8px; font-size:11px;" onclick="sellPosition('${ticker}')">Liquidate</button></td>
                        </tr>
                    `;
                });
            }

            document.getElementById('header-portfolio').innerText = `$${portfolioValue.toLocaleString('en-US', {minimumFractionDigits: 2})}`;
            document.getElementById('header-networth').innerText = `$${(cash + portfolioValue).toLocaleString('en-US', {minimumFractionDigits: 2})}`;
        }

        // Real-time Simulation Engine
        setInterval(() => {
            for (let ticker in stocks) {
                let change = (Math.random() - 0.49) * (stocks[ticker].price * 0.005);
                stocks[ticker].price = Math.max(1, stocks[ticker].price + change);
                stocks[ticker].history.push(stocks[ticker].price);
                if (stocks[ticker].history.length > 10) stocks[ticker].history.shift();
            }
            selectStock(selectedTicker); // refresh active view details
            updateUI();
        }, 3000);

        // Initial Boot
        renderWatchlist();
        updateUI();
    </script>
</body>
</html>
