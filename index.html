<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go Traders - Pro Terminal</title>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-main: #0b0e11;
            --bg-card: #1e2329;
            --border: #2b313a;
            --green: #0ecb81;
            --red: #f6465d;
            --text-main: #eaecef;
            --text-muted: #848e9c;
            --accent: #f0b90b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Header */
        header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 55px;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-stats {
            display: flex;
            gap: 20px;
            font-size: 0.85rem;
        }

        .stat-item span {
            color: var(--text-muted);
            display: block;
            font-size: 0.7rem;
        }

        .stat-item strong {
            font-size: 0.95rem;
        }

        /* Symbol Selector Bar */
        .symbol-bar {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 8px 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            overflow-x: auto;
        }

        .symbol-btn {
            background: #2b313a;
            border: none;
            color: var(--text-muted);
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8rem;
        }

        .symbol-btn.active {
            background: var(--accent);
            color: #000;
        }

        /* Main Terminal Layout */
        .terminal-container {
            display: grid;
            grid-template-columns: 1fr 320px;
            flex: 1;
            overflow: hidden;
        }

        @media (max-width: 900px) {
            .terminal-container {
                grid-template-columns: 1fr;
                overflow-y: auto;
            }
            body { overflow: auto; }
        }

        .left-col {
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
            overflow: hidden;
        }

        .chart-section {
            background: var(--bg-card);
            padding: 15px;
            border-bottom: 1px solid var(--border);
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .current-price {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .chart-box {
            position: relative;
            flex: 1;
            min-height: 250px;
        }

        /* Positions Section */
        .positions-section {
            background: var(--bg-card);
            padding: 15px;
            height: 200px;
            overflow-y: auto;
        }

        .positions-section h3 {
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            text-align: left;
        }

        th {
            color: var(--text-muted);
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
        }

        /* Right Side: Order Book & Trading Panel */
        .right-col {
            display: flex;
            flex-direction: column;
            background: var(--bg-card);
            overflow-y: auto;
        }

        .panel-box {
            padding: 15px;
            border-bottom: 1px solid var(--border);
        }

        .panel-title {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .order-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            padding: 2px 0;
            font-family: monospace;
        }

        .ask-price { color: var(--red); }
        .bid-price { color: var(--green); }

        /* Trade Controls Form */
        .form-group {
            margin-bottom: 10px;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .form-group input {
            width: 100%;
            background: #14181d;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 8px;
            color: var(--text-main);
            outline: none;
            font-size: 0.9rem;
        }

        .trade-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
            transition: opacity 0.2s;
        }

        .btn:hover { opacity: 0.85; }
        .btn-buy { background: var(--green); color: #000; }
        .btn-sell { background: var(--red); color: #fff; }

        .btn-close {
            background: #2b313a;
            color: var(--text-main);
            padding: 4px 8px;
            font-size: 0.75rem;
            border-radius: 3px;
            cursor: pointer;
            border: none;
        }

        .text-green { color: var(--green); font-weight: bold; }
        .text-red { color: var(--red); font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ Go Traders Pro</div>
        <div class="header-stats">
            <div class="stat-item">
                <span>Wallet Balance</span>
                <strong id="walletBalance" style="color: var(--accent);">$10,000.00</strong>
            </div>
            <div class="stat-item">
                <span>Unrealized P&L</span>
                <strong id="totalPnL" class="text-green">$0.00</strong>
            </div>
        </div>
    </header>

    <div class="symbol-bar">
        <button class="symbol-btn active" onclick="switchSymbol('BTC', 65000, 40)">BTC/USDT</button>
        <button class="symbol-btn" onclick="switchSymbol('ETH', 3500, 15)">ETH/USDT</button>
        <button class="symbol-btn" onclick="switchSymbol('SOL', 180, 2)">SOL/USDT</button>
        <button class="symbol-btn" onclick="switchSymbol('DOGE', 0.15, 0.005)">DOGE/USDT</button>
    </div>

    <div class="terminal-container">
        <!-- Left Column: Chart & Open Positions -->
        <div class="left-col">
            <div class="chart-section">
                <div class="chart-header">
                    <div>
                        <h2 id="activeSymbolLabel" style="font-size: 1.1rem;">BTC/USDT</h2>
                        <span style="font-size: 0.75rem; color: var(--text-muted);">Perpetual Simulator</span>
                    </div>
                    <div id="livePriceDisplay" class="current-price text-green">$65,000.00</div>
                </div>
                <div class="chart-box">
                    <canvas id="priceChart"></canvas>
                </div>
            </div>

            <div class="positions-section">
                <h3>Open Positions</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Pair</th>
                            <th>Type</th>
                            <th>Margin</th>
                            <th>Entry Price</th>
                            <th>Live Price</th>
                            <th>P&L ($)</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="positionsTableBody">
                        <!-- Dynamic Positions -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Right Column: Order Book & Trade Panel -->
        <div class="right-col">
            <div class="panel-box">
                <div class="panel-title">Order Book (Live Depth)</div>
                <div id="asksContainer"></div>
                <div id="obMidPrice" style="text-align: center; font-weight: bold; margin: 8px 0; font-size: 1rem;">$65,000.00</div>
                <div id="bidsContainer"></div>
            </div>

            <div class="panel-box" style="flex: 1;">
                <div class="panel-title">Place Order</div>
                <div class="form-group">
                    <label>Amount (USDT)</label>
                    <input type="number" id="tradeAmountInput" value="500" min="10">
                </div>
                <div class="trade-buttons">
                    <button class="btn btn-buy" onclick="executeTrade('BUY')">BUY / LONG</button>
                    <button class="btn btn-sell" onclick="executeTrade('SELL')">SELL / SHORT</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // App State
        let currentSymbol = 'BTC';
        let currentPrice = 65000.00;
        let priceStep = 40;
        let balance = 10000.00;
        let positions = [];
        
        let chartData = Array(30).fill(65000);
        let chartLabels = Array(30).fill('');

        // Chart Initialization
        const ctx = document.getElementById('priceChart').getContext('2d');
        const priceChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: chartLabels,
                datasets: [{
                    data: chartData,
                    borderColor: '#0ecb81',
                    borderWidth: 2,
                    tension: 0.2,
                    pointRadius: 0,
                    fill: false
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                scales: {
                    x: { display: false },
                    y: { 
                        grid: { color: '#2b313a' },
                        ticks: { color: '#848e9c', font: { size: 10 } }
                    }
                },
                plugins: { legend: { display: false } }
            }
        });

        // Switch Market Pair
        function switchSymbol(symbol, basePrice, step) {
            currentSymbol = symbol;
            currentPrice = basePrice;
            priceStep = step;
            document.getElementById('activeSymbolLabelinnerText', symbol + '/USDT');
            document.getElementById('activeSymbolLabel').innerText = symbol + '/USDT';
            
            chartData = Array(30).fill(basePrice);
            priceChart.data.datasets[0].data = chartData;
            priceChart.update();
        }

        // Market Engine Tick
        function marketTick() {
            const fluctuation = (Math.random() - 0.49) * priceStep;
            currentPrice = Math.max(currentPrice * 0.001, currentPrice + fluctuation);

            const priceStr = currentSymbol === 'DOGE' ? currentPrice.toFixed(4) : currentPrice.toFixed(2);
            
            // Update Header Display
            const priceEl = document.getElementById('livePriceDisplay');
            priceEl.innerText = `$${priceStr}`;
            priceEl.className = `current-price ${fluctuation >= 0 ? 'text-green' : 'text-red'}`;

            // Update Chart
            chartData.push(currentPrice);
            chartData.shift();
            priceChart.data.datasets[0].borderColor = fluctuation >= 0 ? '#0ecb81' : '#f6465d';
            priceChart.update();

            // Update Order Book & Positions P&L
            renderOrderBook(priceStr);
            renderPositions();
        }

        // Render Order Book
        function renderOrderBook(midPriceStr) {
            let asksHTML = '';
            let bidsHTML = '';
            const factor = priceStep * 0.1;

            for (let i = 3; i >= 1; i--) {
                const askP = (currentPrice + i * factor).toFixed(currentSymbol === 'DOGE' ? 4 : 2);
                const vol = (Math.random() * 2).toFixed(3);
                asksHTML += `<div class="order-row ask-price"><span>$${askP}</span><span>${vol}</span></div>`;
            }

            for (let i = 1; i <= 3; i++) {
                const bidP = (currentPrice - i * factor).toFixed(currentSymbol === 'DOGE' ? 4 : 2);
                const vol = (Math.random() * 2).toFixed(3);
                bidsHTML += `<div class="order-row bid-price"><span>$${bidP}</span><span>${vol}</span></div>`;
            }

            document.getElementById('asksContainer').innerHTML = asksHTML;
            document.getElementById('bidsContainer').innerHTML = bidsHTML;
            document.getElementById('obMidPrice').innerText = `$${midPriceStr}`;
        }

        // Execute Trade
        function executeTrade(type) {
            const amountInput = document.getElementById('tradeAmountInput');
            const amount = parseFloat(amountInput.value);

            if (isNaN(amount) || amount <= 0 || amount > balance) {
                alert('Invalid amount or insufficient wallet balance!');
                return;
            }

            balance -= amount;
            document.getElementById('walletBalance').innerText = `$${balance.toFixed(2)}`;

            positions.push({
                id: Date.now(),
                symbol: currentSymbol,
                type: type,
                margin: amount,
                entryPrice: currentPrice
            });

            renderPositions();
        }

        // Close Position
        function closePosition(id) {
            const index = positions.findIndex(p => p.id === id);
            if (index !== -1) {
                const pos = positions[index];
                const pnl = pos.type === 'BUY'
                    ? (currentPrice - pos.entryPrice) * (pos.margin / pos.entryPrice)
                    : (pos.entryPrice - currentPrice) * (pos.margin / pos.entryPrice);

                balance += (pos.margin + pnl);
                document.getElementById('walletBalance').innerText = `$${balance.toFixed(2)}`;

                positions.splice(index, 1);
                renderPositions();
            }
        }

        // Render Positions & Compute P&L
        function renderPositions() {
            const tbody = document.getElementById('positionsTableBody');
            tbody.innerHTML = '';

            let totalSessionPnL = 0;

            positions.forEach(pos => {
                const pnl = pos.type === 'BUY'
                    ? (currentPrice - pos.entryPrice) * (pos.margin / pos.entryPrice)
                    : (pos.entryPrice - currentPrice) * (pos.margin / pos.entryPrice);

                totalSessionPnL += pnl;
                const isProfit = pnl >= 0;
                const pnlClass = isProfit ? 'text-green' : 'text-red';
                const dec = pos.symbol === 'DOGE' ? 4 : 2;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${pos.symbol}/USDT</td>
                    <td class="${pos.type === 'BUY' ? 'text-green' : 'text-red'}">${pos.type}</td>
                    <td>$${pos.margin.toFixed(2)}</td>
                    <td>$${pos.entryPrice.toFixed(dec)}</td>
                    <td>$${currentPrice.toFixed(dec)}</td>
                    <td class="${pnlClass}">${isProfit ? '+' : ''}$${pnl.toFixed(2)}</td>
                    <td><button class="btn-close" onclick="closePosition(${pos.id})">Close</button></td>
                `;
                tbody.appendChild(tr);
            });

            const totalPnLEl = document.getElementById('totalPnL');
            totalPnLEl.innerText = `${totalSessionPnL >= 0 ? '+' : ''}$${totalSessionPnL.toFixed(2)}`;
            totalPnLEl.className = totalSessionPnL >= 0 ? 'text-green' : 'text-red';
        }

        // Run Market Loop Every 600ms
        setInterval(marketTick, 600);
    </script>
</body>
</html>
