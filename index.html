<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Login with OTP</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: #1e293b;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            border: 1px solid #334155;
        }

        .card h2 {
            margin-bottom: 8px;
            color: #38bdf8;
            font-size: 24px;
        }

        .card p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            margin-bottom: 8px;
            color: #cbd5e1;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #ffffff;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: #38bdf8;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background-color: #0284c7;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #0369a1;
        }

        .btn:disabled {
            background-color: #475569;
            cursor: not-allowed;
        }

        .status-msg {
            margin-top: 16px;
            font-size: 14px;
            text-align: center;
        }

        .status-msg.error {
            color: #f87171;
        }

        .status-msg.success {
            color: #4ade80;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Step 1: Phone / Mobile Input -->
        <div id="step-mobile">
            <h2>Account Login</h2>
            <p>Apna mobile number daal kar OTP praapt karein</p>
            
            <form id="mobile-form">
                <div class="form-group">
                    <label for="phone">Mobile Number</label>
                    <input type="tel" id="phone" placeholder="+91 9876543210" required />
                </div>
                <button type="submit" class="btn" id="send-otp-btn">OTP Bhejein</button>
            </form>
        </div>

        <!-- Step 2: OTP Verification -->
        <div id="step-otp" class="hidden">
            <h2>Verify OTP</h2>
            <p id="otp-sent-to">OTP aapke mobile par bhej diya gaya hai</p>

            <form id="otp-form">
                <div class="form-group">
                    <label for="otp">Enter 6-Digit OTP</label>
                    <input type="text" id="otp" maxlength="6" placeholder="123456" required />
                </div>
                <button type="submit" class="btn" id="verify-otp-btn">Verify & Login</button>
            </form>
        </div>

        <div id="status-message" class="status-msg"></div>
    </div>

    <script>
        // CONFIGURATION: Apne Backend API URL ya Gateway Endpoint se replace karein
        const API_BASE_URL = "https://your-domain.com/api"; 

        const mobileStep = document.getElementById('step-mobile');
        const otpStep = document.getElementById('step-otp');
        const mobileForm = document.getElementById('mobile-form');
        const otpForm = document.getElementById('otp-form');
        const statusMsg = document.getElementById('status-message');
        const sendBtn = document.getElementById('send-otp-btn');
        const verifyBtn = document.getElementById('verify-otp-btn');

        let userPhone = '';

        // Helper function for messages
        function showMessage(msg, isError = false) {
            statusMsg.innerText = msg;
            statusMsg.className = `status-msg ${isError ? 'error' : 'success'}`;
        }

        // Send OTP API Call
        mobileForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            userPhone = document.getElementById('phone').value.trim();

            if (!userPhone) {
                showMessage("Kripya sahi mobile number daalein.", true);
                return;
            }

            sendBtn.disabled = true;
            sendBtn.innerText = "Bhej rahe hain...";
            showMessage("");

            try {
                /* 
                  BACKEND INTEGRATION:
                  Apne actual API endpoint par POST request bhejein.
                */
                const response = await fetch(`${API_BASE_URL}/send-otp`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone: userPhone })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    showMessage("OTP safaltapoorvak bhej diya gaya!");
                    mobileStep.classList.add('hidden');
                    otpStep.classList.remove('hidden');
                    document.getElementById('otp-sent-to').innerText = `OTP sent to ${userPhone}`;
                } else {
                    throw new Error(data.message || "OTP bhejne me samasya aayi.");
                }

            } catch (err) {
                // Fallback for Demo / Direct Client Logic
                console.error("API Error:", err);
                showMessage(err.message || "Server Error: Code me API URL update karein.", true);
            } finally {
                sendBtn.disabled = false;
                sendBtn.innerText = "OTP Bhejein";
            }
        });

        // Verify OTP API Call
        otpForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const otpCode = document.getElementById('otp').value.trim();

            if (otpCode.length < 4) {
                showMessage("Sahi OTP code daalein.", true);
                return;
            }

            verifyBtn.disabled = true;
            verifyBtn.innerText = "Checking...";
            showMessage("");

            try {
                const response = await fetch(`${API_BASE_URL}/verify-otp`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone: userPhone, otp: otpCode })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    showMessage("Login Successful! Redirecting...");
                    setTimeout(() => {
                        window.location.href = "/dashboard"; // Sahi page path daalein
                    }, 1500);
                } else {
                    throw new Error(data.message || "Incorrect OTP");
                }

            } catch (err) {
                console.error("Verification Error:", err);
                showMessage(err.message || "Invalid OTP, dobara try karein.", true);
            } finally {
                verifyBtn.disabled = false;
                verifyBtn.innerText = "Verify & Login";
            }
        });
    </script>
</body>
</html>
