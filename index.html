<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web App - Phone OTP Authentication</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-8 w-full max-w-md shadow-2xl">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-sky-400">Account Login</h1>
            <p class="text-slate-400 text-sm mt-1">Apne mobile number se login karein</p>
        </div>

        <!-- Notification Banner -->
        <div id="alert-box" class="hidden mb-4 p-3 rounded-lg text-sm text-center"></div>

        <!-- STEP 1: Phone Number Input -->
        <form id="phone-form" class="space-y-4">
            <div>
                <label for="phone-input" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Mobile Number</label>
                <div class="flex">
                    <span class="inline-flex items-center px-3 rounded-l-lg border border-r-0 border-slate-600 bg-slate-700 text-slate-300 text-sm">+91</span>
                    <input type="tel" id="phone-input" maxlength="10" placeholder="9876543210" required 
                           class="w-full bg-slate-900 border border-slate-600 rounded-r-lg px-4 py-3 text-white focus:outline-none focus:border-sky-500 transition">
                </div>
            </div>

            <button type="submit" id="send-otp-btn" 
                    class="w-full bg-sky-600 hover:bg-sky-500 text-white font-semibold py-3 rounded-lg transition duration-200 disabled:opacity-50">
                OTP Bhejein
            </button>
        </form>

        <!-- STEP 2: OTP Input (Initially Hidden) -->
        <form id="otp-form" class="space-y-4 hidden mt-4">
            <div>
                <div class="flex justify-between items-center mb-2">
                    <label for="otp-input" class="text-xs font-semibold text-slate-300 uppercase tracking-wider">6-Digit OTP</label>
                    <span id="target-phone" class="text-xs text-sky-400"></span>
                </div>
                <input type="text" id="otp-input" maxlength="6" placeholder="123456" required
                       class="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-3 text-center text-xl font-mono tracking-widest text-white focus:outline-none focus:border-sky-500 transition">
            </div>

            <button type="submit" id="verify-otp-btn" 
                    class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-lg transition duration-200 disabled:opacity-50">
                OTP Verify Karein
            </button>

            <div class="flex justify-between items-center text-xs text-slate-400 mt-2">
                <button type="button" id="resend-btn" disabled class="hover:underline disabled:text-slate-600">
                    Resend OTP
                </button>
                <span id="timer-text">00:30</span>
            </div>
        </form>
    </div>

    <script>
        // Backend Server URL
        const BACKEND_URL = "http://localhost:5000/api";

        const phoneForm = document.getElementById('phone-form');
        const otpForm = document.getElementById('otp-form');
        const phoneInput = document.getElementById('phone-input');
        const otpInput = document.getElementById('otp-input');
        const sendBtn = document.getElementById('send-otp-btn');
        const verifyBtn = document.getElementById('verify-otp-btn');
        const resendBtn = document.getElementById('resend-btn');
        const alertBox = document.getElementById('alert-box');
        const targetPhoneLabel = document.getElementById('target-phone');
        const timerText = document.getElementById('timer-text');

        let fullPhoneNumber = '';
        let timerInterval = null;

        function showAlert(message, type = 'error') {
            alertBox.innerText = message;
            alertBox.classList.remove('hidden', 'bg-red-500/10', 'text-red-400', 'bg-emerald-500/10', 'text-emerald-400', 'border-red-500/20', 'border-emerald-500/20');
            
            if (type === 'error') {
                alertBox.classList.add('bg-red-500/10', 'text-red-400', 'border', 'border-red-500/20');
            } else {
                alertBox.classList.add('bg-emerald-500/10', 'text-emerald-400', 'border', 'border-emerald-500/20');
            }
        }

        function startTimer(seconds = 30) {
            clearInterval(timerInterval);
            let left = seconds;
            resendBtn.disabled = true;

            timerInterval = setInterval(() => {
                left--;
                timerText.innerText = `00:${left < 10 ? '0' : ''}${left}`;
                if (left <= 0) {
                    clearInterval(timerInterval);
                    timerText.innerText = '';
                    resendBtn.disabled = false;
                }
            }, 1000);
        }

        // Send OTP Action
        phoneForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const rawPhone = phoneInput.value.trim();

            if (rawPhone.length !== 10) {
                showAlert('Kripya 10-digit ka valid mobile number likhein.');
                return;
            }

            fullPhoneNumber = `+91${rawPhone}`;
            sendBtn.disabled = true;
            sendBtn.innerText = 'Bhej rahe hain...';

            try {
                const response = await fetch(`${BACKEND_URL}/send-otp`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone: fullPhoneNumber })
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert('OTP aapke mobile number par bhej diya gaya h!', 'success');
                    phoneForm.classList.add('hidden');
                    otpForm.classList.remove('hidden');
                    targetPhoneLabel.innerText = fullPhoneNumber;
                    startTimer(30);
                } else {
                    throw new Error(data.message || 'OTP bhejne me samasya aayi.');
                }
            } catch (err) {
                showAlert(err.message || 'Server error! Check karein ki Backend server live hai ya nahi.');
            } finally {
                sendBtn.disabled = false;
                sendBtn.innerText = 'OTP Bhejein';
            }
        });

        // Verify OTP Action
        otpForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const otpVal = otpInput.value.trim();

            if (otpVal.length !== 6) {
                showAlert('6-digit ka valid OTP daalein.');
                return;
            }

            verifyBtn.disabled = true;
            verifyBtn.innerText = 'Verify kar rahe hain...';

            try {
                const response = await fetch(`${BACKEND_URL}/verify-otp`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone: fullPhoneNumber, otp: otpVal })
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert('Login Safal Hua! Dashboard par redirect ho rahe hain...', 'success');
                    setTimeout(() => {
                        window.location.href = '/dashboard.html';
                    }, 1500);
                } else {
                    throw new Error(data.message || 'Galat OTP daala hai.');
                }
            } catch (err) {
                showAlert(err.message || 'Verification fail ho gaya.');
            } finally {
                verifyBtn.disabled = false;
                verifyBtn.innerText = 'OTP Verify Karein';
            }
        });

        // Resend OTP Action
        resendBtn.addEventListener('click', () => {
            phoneForm.dispatchEvent(new Event('submit'));
        });
    </script>
</body>
</html>
