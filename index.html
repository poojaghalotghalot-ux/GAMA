<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go Traders - Advanced Live Terminal</title>
    <!-- Chart.js for Realistic Moving Charts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-dark: #0b0e11;
            --card-bg: #1e2329;
            --border-color: #2b313a;
            --green: #0ecb81;
            --red: #f6465d;
            --text-main: #eaecef;
            --text-sub: #848e9c;
            --gold: #f0b90b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Top Header */
        header {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .logo {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--gold);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stats-bar {
            display: flex;
            gap: 15px;
        }

        .stat-box {
            background: #14181d;
            padding: 6px 14px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            font-size: 0.85rem;
        }

        .stat-box label {
            color: var(--text-sub);
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
        }

        .stat-box val {
            font-weight: bold;
            font-size: 0.95rem;
        }

        .val-green { color: var(--green); }
        .val-red { color: var(--red); }
        .val-gold { color: var(--gold); }

        /* Main Grid Layout */
        .terminal-grid {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 10px;
            padding: 10px;
            flex: 1;
        }

        @media (max-width: 850px) {
            .terminal-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Main Left Panel */
        .main-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chart-card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 15px;
            border: 1px solid var(--border-color);
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .symbol-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .price-display {
            font-size: 1.5rem;
            font-weight: 800;
        }

        .price-up { color: var(--green); }
        .price-down { color: var(--red); }

        .chart-container {
            position: relative;
            height: 320px;
            width: 100%;
        }

        /* Positions Card */
        .positions-card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 15px;
            border: 1px solid var(--border-color);
            flex: 1;
        }

        .positions-card h3 {
            font-size: 0.95rem;
            margin-bottom: 10px;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            text-align: left;
            min-width: 600px;
        }

        th { 
            color: var(--text-sub); 
            padding-bottom: 10px; 
            font-size: 0.75rem; 
            text-transform: uppercase; 
            border-bottom: 1px solid var(--border-color);
        }

        td { 
            padding: 10px 0; 
            border-bottom: 1px solid var(--border-color); 
            vertical-align: middle;
        }

        /* Status Badge */
        .badge {
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: bold;
        }

        .badge-win {
            background: rgba(14, 203, 129, 0.15);
            color: var(--green);
            border: 1px solid var(--green);
        }

        .badge-loss {
            background: rgba(246, 70, 93, 0.15);
            color: var(--red);
            border: 1px solid var(--red);
        }

        /* Side Panel */
        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .order-book, .trade-form {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 15px;
            border: 1px solid var(--border-color);
        }

        .order-book-title {
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .ob-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            padding: 3px 0;
            font-family: monospace;
        }

        .ob-ask { color: var(--red); }
        .ob-bid { color: var(--green); }

        /* Form Styling */
        .form-group {
            margin-bottom: 10px;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-sub);
            margin-bottom: 4px;
        }

        .form-group input {
            width: 100%;
            background: #14181d;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 8px 10px;
            color: var(--text-main);
            outline: none;
            font-size: 0.9rem;
        }

        .form-group input:focus {
            border-color: var(--gold);
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .btn {
            padding: 10px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-buy { background: var(--green); color: #000; }
        .btn-buy:hover { background: #0bbb75; }

        .btn-sell { background: var(--red); color: #fff; }
        .btn-sell:hover { background: #e03e53; }

        .btn-close {
            background: #2b313a;
            color: var(--text-main);
            padding: 4px 10px;
            font-size: 0.75rem;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .btn-close:hover {
            border-color: var(--text-sub);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ Go Traders Pro</div>
        
        <div class="stats-bar">
            <div class="stat-box">
                <label>Available Balance</label>
                <val id="balance" class="val-gold">$10,000.00</val>
            </div>
            <div class="stat-box">
                <label>Unrealized P&L (Win/Loss)</label>
                <val id="unrealizedPnL" class="val-green">+$0.00 (0.00%)</val>
            </div>
            <div class="stat-box">
                <label>Total Portfolio Equity</label>
                <val id="totalEquity">$10,000.00</val>
            </div>
        </div>
    </header>

    <div class="terminal-grid">
        <!-- Main Panel -->
        <div class="main-panel">
            <div class="chart-card">
                <div class="chart-header">
                    <div class="symbol-info">
                        <h2>BTC/USDT</h2>
                        <div id="livePrice" class="price-display price-up">$65,000.00</div>
                    </div>
                </div>
                <div class="chart-container">
                    <canvas id="marketChart"></canvas>
                </div>
            </div>

            <div class="positions-card">
                <h3>
                    <span>Active Open Positions</span>
                    <span id="activeTradesCount" style="color: var(--text-sub); font-size: 0.8rem;">0 Open</span>
                </h3>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Type</th>
                                <th>Margin (Amount)</th>
                                <th>Entry Price</th>
                                <th>Current Price</th>
                                <th>Profit / Loss ($)</th>
                                <th>Return (%)</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="positionsTable">
                            <!-- Live Trades Auto Generated Here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Side Panel -->
        <div class="side-panel">
            <div class="order-book">
                <div class="order-book-title">Live Order Depth</div>
                <div id="asksContainer"></div>
                <div style="text-align: center; margin: 8px 0; font-weight: bold; font-size: 0.95rem;" id="obCurrentPrice">$65,000.00</div>
                <div id="bidsContainer"></div>
            </div>

            <div class="trade-form">
                <div class="form-group">
                    <label>Trade Amount (USDT)</label>
                    <input type="number" id="tradeAmount" value="500" min="10">
                </div>
                <div class="btn-group">
                    <button class="btn btn-buy" onclick="placeTrade('BUY')">BUY / LONG 📈</button>
                    <button class="btn btn-sell" onclick="placeTrade('SELL')">SELL / SHORT 📉</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // State Management
        let balance = 10000;
        let currentPrice = 65000.00;
        let positions = [];
        let chartData = Array(35).fill(65000);
        let chartLabels = Array(35).fill('');

        // Audio Effects (Beep Cues)
        function playAudio(freq) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.08, ctx.currentTime);
                osc.start();
                osc.stop(ctx.currentTime + 0.12);
            } catch(e){}
        }

        // Initialize Chart.js Real-time Graph
        const ctx = document.getElementById('marketChart').getContext('2d');
        const marketChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: chartLabels,
                datasets: [{
                    label: 'BTC/USDT',
                    data: chartData,
                    borderColor: '#0ecb81',
                    borderWidth: 2,
                    tension: 0.25,
                    pointRadius: 0,
                    fill: false
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                scales: {
                    x: { display: false },
                    y: { 
                        grid: { color: '#2b313a' },
                        ticks: { color: '#848e9c' }
                    }
                },
                plugins: { legend: { display: false } }
            }
        });

        // Market Engine Simulation
        function updateMarket() {
            // Realistic Market Fluctuation
            const change = (Math.random() - 0.495) * 45;
            currentPrice = Math.max(1000, currentPrice + change);

            // Update Header & Price Labels
            const priceEl = document.getElementById('livePrice');
            priceEl.innerText = `$${currentPrice.toFixed(2)}`;
            priceEl.className = `price-display ${change >= 0 ? 'price-up' : 'price-down'}`;

            // Update Chart Dataset
            chartData.push(currentPrice);
            chartData.shift();
            marketChart.data.datasets[0].borderColor = change >= 0 ? '#0ecb81' : '#f6465d';
            marketChart.update();

            // Refresh UI Views
            renderOrderBook();
            renderPositions();
        }

        // Render Live Order Book
        function renderOrderBook() {
            let asksHTML = '';
            let bidsHTML = '';

            for (let i = 3; i >= 1; i--) {
                const askP = (currentPrice + i * 3.5).toFixed(2);
                const askVol = (Math.random() * 0.9 + 0.1).toFixed(3);
                asksHTML += `<div class="ob-row ob-ask"><span>$${askP}</span><span>${askVol} BTC</span></div>`;
            }

            for (let i = 1; i <= 3; i++) {
                const bidP = (currentPrice - i * 3.5).toFixed(2);
                const bidVol = (Math.random() * 0.9 + 0.1).toFixed(3);
                bidsHTML += `<div class="ob-row ob-bid"><span>$${bidP}</span><span>${bidVol} BTC</span></div>`;
            }

            document.getElementById('asksContainer').innerHTML = asksHTML;
            document.getElementById('bidsContainer').innerHTML = bidsHTML;
            document.getElementById('obCurrentPrice').innerText = `$${currentPrice.toFixed(2)}`;
        }

        // Place Trade Action
        function placeTrade(type) {
            const amountInput = document.getElementById('tradeAmount');
            const amount = parseFloat(amountInput.value);

            if (isNaN(amount) || amount <= 0 || amount > balance) {
                alert('Insufficient Wallet Balance or Invalid Amount!');
                return;
            }

            balance -= amount;
            document.getElementById('balance').innerText = `$${balance.toFixed(2)}`;

            positions.push({
                id: Date.now(),
                type: type,
                amount: amount,
                entryPrice: currentPrice
            });

            playAudio(type === 'BUY' ? 900 : 450);
            renderPositions();
        }

        // Close Single Position
        function closePosition(id) {
            const index = positions.findIndex(p => p.id === id);
            if (index !== -1) {
                const pos = positions[index];
                const pnl = pos.type === 'BUY' 
                    ? (currentPrice - pos.entryPrice) * (pos.amount / pos.entryPrice)
                    : (pos.entryPrice - currentPrice) * (pos.amount / pos.entryPrice);

                balance += (pos.amount + pnl);
                document.getElementById('balance').innerText = `$${balance.toFixed(2)}`;
                
                positions.splice(index, 1);
                playAudio(650);
                renderPositions();
            }
        }

        // Render Positions & Compute Portfolio Real-Time Win/Loss
        function renderPositions() {
            const tbody = document.getElementById('positionsTable');
            tbody.innerHTML = '';

            let totalPnL = 0;
            let totalInvested = 0;

            document.getElementById('activeTradesCount').innerText = `${positions.length} Open`;

            positions.forEach(pos => {
                const pnl = pos.type === 'BUY' 
                    ? (currentPrice - pos.entryPrice) * (pos.amount / pos.entryPrice)
                    : (pos.entryPrice - currentPrice) * (pos.amount / pos.entryPrice);

                const pnlPercent = (pnl / pos.amount) * 100;
                totalPnL += pnl;
                totalInvested += pos.amount;

                const isWinning = pnl >= 0;
                const pnlClass = isWinning ? 'val-green' : 'val-red';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="color: ${pos.type === 'BUY' ? 'var(--green)' : 'var(--red)'}; font-weight: bold;">${pos.type}</td>
                    <td>$${pos.amount.toFixed(2)}</td>
                    <td>$${pos.entryPrice.toFixed(2)}</td>
                    <td>$${currentPrice.toFixed(2)}</td>
                    <td class="${pnlClass}" style="font-weight: bold;">${isWinning ? '+' : ''}$${pnl.toFixed(2)}</td>
                    <td class="${pnlClass}" style="font-weight: bold;">${isWinning ? '+' : ''}${pnlPercent.toFixed(2)}%</td>
                    <td><span class="badge ${isWinning ? 'badge-win' : 'badge-loss'}">${isWinning ? 'PROFIT' : 'LOSS'}</span></td>
                    <td><button class="btn-close" onclick="closePosition(${pos.id})">Close Trade</button></td>
                `;
                tbody.appendChild(tr);
            });

            // Update Global Portfolio Summary
            const pnlEl = document.getElementById('unrealizedPnL');
            const totalPnLPercent = totalInvested > 0 ? (totalPnL / totalInvested) * 100 : 0;
            
            pnlEl.innerText = `${totalPnL >= 0 ? '+' : ''}$${totalPnL.toFixed(2)} (${totalPnLPercent.toFixed(2)}%)`;
            pnlEl.className = totalPnL >= 0 ? 'val-green' : 'val-red';

            const equity = balance + totalInvested + totalPnL;
            document.getElementById('totalEquity').innerText = `$${equity.toFixed(2)}`;
        }

        // Live Loop (Updates every 550ms)
        setInterval(updateMarket, 550);
    </script>
</body>
</html>
