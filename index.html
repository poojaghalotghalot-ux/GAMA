<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go Traders | StockGro Gamified Experience</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --sg-purple: #6c5ce7;
            --sg-purple-dark: #5b4bc4;
            --sg-bg: #0b0e17;
            --sg-card: #151a26;
            --sg-card-inner: #1c2333;
            --sg-green: #00e676;
            --sg-red: #ff3d00;
            --sg-border: #232d42;
            --sg-text: #ffffff;
            --sg-subtext: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--sg-bg);
            color: var(--sg-text);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* App Mobile Wrapper Container */
        .app-frame {
            width: 100%;
            max-width: 480px;
            background-color: var(--sg-bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
            border-left: 1px solid var(--sg-border);
            border-right: 1px solid var(--sg-border);
            padding-bottom: 75px;
        }

        /* Top Header */
        .app-header {
            padding: 16px 20px;
            background: var(--sg-card);
            border-bottom: 1px solid var(--sg-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--sg-purple), #a29bfe);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 14px;
        }

        .cash-badge {
            background: rgba(0, 230, 118, 0.12);
            border: 1px solid rgba(0, 230, 118, 0.3);
            color: var(--sg-green);
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 13px;
        }

        /* Main Feed Body */
        .feed-container {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* StockGro League Banner Card */
        .league-card {
            background: linear-gradient(135deg, #2b1a6e, #151a26);
            border: 1px solid var(--sg-purple);
            border-radius: 18px;
            padding: 18px;
            position: relative;
            overflow: hidden;
        }

        .league-card::after {
            content: 'LIVE';
            position: absolute;
            top: 14px;
            right: 14px;
            background: var(--sg-red);
            font-size: 10px;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 6px;
        }

        .league-title {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .league-pool {
            font-size: 22px;
            font-weight: 800;
            color: var(--sg-green);
            margin: 8px 0;
        }

        /* Category Tabs */
        .tab-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .tab-chip {
            background: var(--sg-card);
            border: 1px solid var(--sg-border);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            color: var(--sg-subtext);
            white-space: nowrap;
            cursor: pointer;
        }

        .tab-chip.active {
            background: var(--sg-purple);
            color: #fff;
            border-color: var(--sg-purple);
        }

        /* Stock Cards List (StockGro Style Progress Cards) */
        .stock-card {
            background: var(--sg-card);
            border: 1px solid var(--sg-border);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .stock-card:active {
            transform: scale(0.98);
        }

        .stock-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stock-identity {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .stock-logo {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: var(--sg-card-inner);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 16px;
            color: var(--sg-purple);
            border: 1px solid var(--sg-border);
        }

        .stock-name {
            font-size: 15px;
            font-weight: 700;
        }

        .stock-cat {
            font-size: 11px;
            color: var(--sg-subtext);
        }

        .stock-price {
            font-size: 16px;
            font-weight: 800;
            text-align: right;
        }

        .stock-badge {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            margin-top: 2px;
            display: inline-block;
        }

        .badge-green { background: rgba(0, 230, 118, 0.15); color: var(--sg-green); }
        .badge-red { background: rgba(255, 61, 0, 0.15); color: var(--sg-red); }

        /* Progress Bar representing Volume/Trend */
        .trend-bar-bg {
            height: 6px;
            background: var(--sg-card-inner);
            border-radius: 3px;
            overflow: hidden;
            width: 100%;
        }

        .trend-bar-fill {
            height: 100%;
            border-radius: 3px;
        }

        /* Modal Buy/Sell Drawer (StockGro Sheet Style) */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: flex-end;
            z-index: 200;
        }

        .bottom-sheet {
            background: var(--sg-card);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 24px;
            width: 100%;
            max-width: 480px;
            border: 1px solid var(--sg-border);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .sheet-handle {
            width: 40px;
            height: 4px;
            background: var(--sg-subtext);
            border-radius: 2px;
            margin: 0 auto 20px auto;
            opacity: 0.4;
        }

        .action-btns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }

        .btn-act {
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            color: #fff;
        }

        .btn-buy-act { background: var(--sg-green); color: #000; }
        .btn-sell-act { background: var(--sg-red); }

        /* Bottom App Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 480px;
            height: 65px;
            background: var(--sg-card);
            border-top: 1px solid var(--sg-border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            font-weight: 700;
            color: var(--sg-subtext);
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--sg-purple);
        }

        .nav-icon {
            font-size: 18px;
        }
    </style>
</head>
<body>

    <!-- Main Mobile Frame -->
    <div class="app-frame">
        
        <!-- Header -->
        <div class="app-header">
            <div class="user-profile">
                <div class="avatar">GT</div>
                <div>
                    <div style="font-size: 14px; font-weight: 800;">Go Traders</div>
                    <div style="font-size: 10px; color: var(--sg-subtext);">Pro League Player</div>
                </div>
            </div>
            <div class="cash-badge" id="user-cash">₹1,00,000</div>
        </div>

        <!-- Feed Body -->
        <div class="feed-container">
            
            <!-- StockGro Tournament League Banner -->
            <div class="league-card">
                <div class="league-title">🔥 Mega League #2026</div>
                <div style="font-size: 12px; color: var(--sg-subtext);">Virtual Practice Pool</div>
                <div class="league-pool">₹10,00,000 Prize Pool</div>
                <button style="background: var(--sg-purple); color: #fff; border: none; padding: 8px 16px; border-radius: 10px; font-weight: 700; font-size: 12px; cursor: pointer;">JOINED</button>
            </div>

            <!-- Categories -->
            <div class="tab-scroll">
                <div class="tab-chip active">All Stocks</div>
                <div class="tab-chip">Top Gainers</div>
                <div class="tab-chip">Top Losers</div>
                <div class="tab-chip">Indices</div>
            </div>

            <!-- Stock List (Dynamic StockGro Style Cards) -->
            <div id="stock-cards-list" style="display: flex; flex-direction: column; gap: 12px;">
                <!-- Dynamically rendered -->
            </div>

        </div>

        <!-- Bottom App Navigation Bar -->
        <div class="bottom-nav">
            <div class="nav-item active">
                <span class="nav-icon">📊</span>
                <span>Markets</span>
            </div>
            <div class="nav-item" onclick="alert('Leagues Active: Pro League #2026')">
                <span class="nav-icon">🏆</span>
                <span>Leagues</span>
            </div>
            <div class="nav-item" onclick="showPositionsSheet()">
                <span class="nav-icon">💼</span>
                <span>Portfolio</span>
            </div>
            <div class="nav-item" onclick="alert('Profile: Go Traders Virtual Trader')">
                <span class="nav-icon">👤</span>
                <span>Profile</span>
            </div>
        </div>

    </div>

    <!-- Trade Execution Sheet Modal -->
    <div class="modal-overlay" id="trade-modal" onclick="closeSheet(event)">
        <div class="bottom-sheet" onclick="event.stopPropagation()">
            <div class="sheet-handle"></div>
            
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h2 id="modal-stock-title" style="font-size: 20px; font-weight: 800;">RELIANCE</h2>
                    <span id="modal-stock-cat" style="font-size: 12px; color: var(--sg-subtext);">EQUITY</span>
                </div>
                <div style="text-align: right;">
                    <div id="modal-stock-price" style="font-size: 20px; font-weight: 800;">₹2,450.00</div>
                </div>
            </div>

            <!-- Chart -->
            <div style="height: 120px; margin: 15px 0;">
                <canvas id="modalChart"></canvas>
            </div>

            <div style="margin-bottom: 12px;">
                <label style="font-size: 12px; color: var(--sg-subtext); display: block; margin-bottom: 6px;">Quantity</label>
                <input type="number" id="trade-qty" value="10" min="1" style="width: 100%; background: var(--sg-card-inner); border: 1px solid var(--sg-border); padding: 12px; border-radius: 10px; color: #fff; font-weight: 700; font-size: 16px; outline: none;">
            </div>

            <div class="action-btns">
                <button class="btn-act btn-buy-act" onclick="placeTrade('BUY')">BUY</button>
                <button class="btn-act btn-sell-act" onclick="placeTrade('SELL')">SELL</button>
            </div>
        </div>
    </div>

    <script>
        // System Data
        let userCash = 100000;
        let stocks = {
            'RELIANCE': { price: 2450.00, change: 1.85, category: 'NIFTY 50', volume: 85 },
            'TATA MOTORS': { price: 620.50, change: -0.90, category: 'AUTOMOBILE', volume: 45 },
            'HDFC BANK': { price: 1540.00, change: 0.45, category: 'BANKING', volume: 60 },
            'INFOSYS': { price: 1420.00, change: 2.15, category: 'IT SECTOR', volume: 90 },
            'NIFTY 50': { price: 18500.00, change: 0.65, category: 'INDEX', volume: 75 }
        };

        let selectedStockKey = 'RELIANCE';
        let positions = [];

        // Chart.js Setup
        const ctx = document.getElementById('modalChart').getContext('2d');
        const modalChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['1', '2', '3', '4', '5'],
                datasets: [{
                    data: [2420, 2435, 2425, 2440, 2450],
                    borderColor: '#00e676',
                    borderWidth: 3,
                    tension: 0.4,
                    pointRadius: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: { x: { display: false }, y: { display: false } }
            }
        });

        // Render Stock Cards (StockGro Feed Style)
        function renderStockCards() {
            const container = document.getElementById('stock-cards-list');
            container.innerHTML = '';

            for (let key in stocks) {
                let item = stocks[key];
                let isUp = item.change >= 0;
                let card = document.createElement('div');
                card.className = 'stock-card';
                card.onclick = () => openTradeSheet(key);

                card.innerHTML = `
                    <div class="stock-top">
                        <div class="stock-identity">
                            <div class="stock-logo">${key.charAt(0)}</div>
                            <div>
                                <div class="stock-name">${key}</div>
                                <div class="stock-cat">${item.category}</div>
                            </div>
                        </div>
                        <div>
                            <div class="stock-price">₹${item.price.toFixed(2)}</div>
                            <div class="stock-badge ${isUp ? 'badge-green' : 'badge-red'}" style="float: right;">
                                ${isUp ? '▲ +' : '▼ '}${item.change.toFixed(2)}%
                            </div>
                        </div>
                    </div>
                    <div class="trend-bar-bg">
                        <div class="trend-bar-fill" style="width: ${item.volume}%; background: ${isUp ? 'var(--sg-green)' : 'var(--sg-red)'};"></div>
                    </div>
                `;
                container.appendChild(card);
            }
        }

        function openTradeSheet(key) {
            selectedStockKey = key;
            document.getElementById('modal-stock-title').innerText = key;
            document.getElementById('modal-stock-cat').innerText = stocks[key].category;
            document.getElementById('modal-stock-price').innerText = '₹' + stocks[key].price.toFixed(2);
            document.getElementById('trade-modal').style.display = 'flex';

            modalChart.data.datasets[0].data = Array.from({length: 5}, () => stocks[key].price + (Math.random() - 0.5) * 10);
            modalChart.data.datasets[0].borderColor = stocks[key].change >= 0 ? '#00e676' : '#ff3d00';
            modalChart.update();
        }

        function closeSheet(e) {
            document.getElementById('trade-modal').style.display = 'none';
        }

        // Live Market Simulation Engine
        setInterval(() => {
            for (let key in stocks) {
                let shift = (Math.random() - 0.49) * 3;
                stocks[key].price = Math.max(1, stocks[key].price + shift);
            }

            if (document.getElementById('trade-modal').style.display === 'flex') {
                document.getElementById('modal-stock-price').innerText = '₹' + stocks[selectedStockKey].price.toFixed(2);
            }

            renderStockCards();
        }, 1500);

        // Trade Action
        function placeTrade(type) {
            let qty = parseInt(document.getElementById('trade-qty').value) || 0;
            let currentPrice = stocks[selectedStockKey].price;
            let total = qty * currentPrice;

            if (type === 'BUY' && total > userCash) return alert('Virtual Cash Limit Exceeded!');

            if (type === 'BUY') userCash -= total;
            else userCash += total;

            positions.push({
                symbol: selectedStockKey,
                type: type,
                qty: qty,
                price: currentPrice
            });

            document.getElementById('user-cash').innerText = '₹' + userCash.toLocaleString('en-IN', {maximumFractionDigits: 0});
            alert(`${type} Order Successful for ${qty} shares of ${selectedStockKey}!`);
            document.getElementById('trade-modal').style.display = 'none';
        }

        function showPositionsSheet() {
            if (positions.length === 0) return alert('No active positions in Portfolio.');
            let msg = "Portfolio Holdings:\n";
            positions.forEach(p => {
                msg += `${p.symbol} - ${p.type} ${p.qty} Qty @ ₹${p.price.toFixed(2)}\n`;
            });
            alert(msg);
        }

        // Init
        renderStockCards();
    </script>
</body>
</html>
